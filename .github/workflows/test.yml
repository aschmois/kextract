name: Build and test kextract

on:
  push:
    branches: [kextract]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOOLCHAIN_VERSION: 25
  GRADLE_JAVA_VERSION: 21
  LLVM_VERSION: 22.1.6
  KOTLIN_VERSION: 2.3.21

jobs:
  validate-gradle-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gradle/actions/wrapper-validation@v4

  build-and-test:
    needs: [validate-gradle-wrapper]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            run-examples: true
          - os: macos-14
            platform: macos-aarch64
            run-examples: true
          - os: windows-latest
            platform: windows-x86_64
            run-examples: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: setup
        uses: ./.github/actions/setup-kextract-build
        with:
          toolchain-version: ${{ env.TOOLCHAIN_VERSION }}
          gradle-java-version: ${{ env.GRADLE_JAVA_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          platform: ${{ matrix.platform }}

      - name: 'Install kotlinc'
        if: matrix.run-examples
        shell: bash
        run: |
          curl -fsSL -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlinc/bin/kotlinc" -version

      - name: 'Build'
        shell: bash
        run: |
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            assemble

      - name: 'Unit tests'
        shell: bash
        # Point JAVA_HOME at JDK 25 (the toolchain JDK) so that kotlinc, when invoked
        # by ExamplesSmokeTest's run.sh scripts, compiles the generated bindings with a
        # Panama-aware compiler. Gradle itself still uses -Pjdk_home for the test toolchain.
        env:
          JAVA_HOME: ${{ steps.setup.outputs.toolchain-path }}
        run: |
          set +e
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            test
          GRADLE_EXIT=$?
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            # On Linux, libclang's atexit handler races with JDK 25's shutdown
            # sequence and segfaults the test JVM after every test has already
            # passed (exit 134 / SIGABRT). If we can find test XML reports AND
            # none of them reports any failures or errors, treat the build as
            # successful — every test passed; only the JVM teardown didn't.
            if [ -d build/test-results/test ] && \
               ls build/test-results/test/*.xml >/dev/null 2>&1 && \
               ! grep -l 'failures="[1-9]\|errors="[1-9]' build/test-results/test/*.xml >/dev/null 2>&1; then
              echo "::warning::Gradle exited $GRADLE_EXIT but every test XML shows 0 failures/errors — accepting as success (likely libclang-on-Linux shutdown SIGSEGV)."
              exit 0
            fi
            exit $GRADLE_EXIT
          fi

      - name: 'Examples smoke test'
        if: matrix.run-examples
        shell: bash
        env:
          JAVA_HOME: ${{ steps.setup.outputs.toolchain-path }}
        run: |
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            verifyExamples

      - name: 'Upload test reports'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
