name: Build and test kextract

on:
  push:
    branches: [kextract]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOOLCHAIN_VERSION: 25
  GRADLE_JAVA_VERSION: 21
  LLVM_VERSION: 22.1.6
  KOTLIN_VERSION: 2.3.21

jobs:
  validate-gradle-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gradle/actions/wrapper-validation@v4

  build-and-test:
    needs: [validate-gradle-wrapper]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            run-examples: true
          - os: macos-14
            platform: macos-aarch64
            run-examples: true
          - os: windows-latest
            platform: windows-x86_64
            run-examples: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: setup
        uses: ./.github/actions/setup-kextract-build
        with:
          toolchain-version: ${{ env.TOOLCHAIN_VERSION }}
          gradle-java-version: ${{ env.GRADLE_JAVA_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          platform: ${{ matrix.platform }}

      - name: 'Install kotlinc'
        if: matrix.run-examples
        shell: bash
        run: |
          curl -fsSL -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlinc/bin/kotlinc" -version

      - name: 'Build'
        shell: bash
        run: |
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            assemble

      - name: 'Unit tests'
        shell: bash
        # Point JAVA_HOME at JDK 25 (the toolchain JDK) so that kotlinc, when invoked
        # by ExamplesSmokeTest's run.sh scripts, compiles the generated bindings with a
        # Panama-aware compiler. Gradle itself still uses -Pjdk_home for the test toolchain.
        env:
          JAVA_HOME: ${{ steps.setup.outputs.toolchain-path }}
        run: |
          rm -rf build/test-results/test
          rm -f build/test-plan-completion/test.properties
          set +e
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            test
          GRADLE_EXIT=$?
          if [ "$GRADLE_EXIT" -eq 0 ]; then
            exit 0
          fi
          if [ "$RUNNER_OS" != "Linux" ] || { [ "$GRADLE_EXIT" -ne 134 ] && [ "$GRADLE_EXIT" -ne 139 ]; }; then
            exit "$GRADLE_EXIT"
          fi
          MARKER=build/test-plan-completion/test.properties
          if [ ! -f "$MARKER" ]; then
            exit "$GRADLE_EXIT"
          fi
          ruby <<'RUBY'
          require "rexml/document"

          directory = "build/test-results/test"
          marker = File.read("build/test-plan-completion/test.properties")
          marker_match = marker.match(/^tests=(\d+)$/)
          abort "Invalid kextract completion marker" unless marker_match
          expected_tests = Integer(marker_match[1])
          reports = Dir[File.join(directory, "TEST-*.xml")]
          abort "No kextract XML test reports found" if reports.empty?

          actual_tests = reports.sum do |path|
            suite = REXML::Document.new(File.read(path)).root
            abort "Invalid test report: #{path}" unless suite&.name == "testsuite"
            failures = Integer(suite.attributes["failures"])
            errors = Integer(suite.attributes["errors"])
            abort "Failed kextract test report: #{path}" unless failures.zero? && errors.zero?
            Integer(suite.attributes["tests"])
          end
          abort "Incomplete kextract reports: expected #{expected_tests} tests, found #{actual_tests}" unless actual_tests == expected_tests
          RUBY
          XML_EXIT=$?
          if [ "$XML_EXIT" -ne 0 ]; then
            exit "$GRADLE_EXIT"
          fi
          echo "::warning::Gradle exited $GRADLE_EXIT after the complete clean test plan — accepting the known libclang/JDK 25 shutdown SIGSEGV."

      - name: 'Examples smoke test'
        if: matrix.run-examples
        shell: bash
        env:
          JAVA_HOME: ${{ steps.setup.outputs.toolchain-path }}
        run: |
          ./gradlew \
            -Pjdk_home="${{ steps.setup.outputs.toolchain-path }}" \
            -Pllvm_home= \
            verifyExamples

      - name: 'Upload test reports'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/**
            build/test-results/**
            build/test-plan-completion/**
            hs_err_pid*.log
          if-no-files-found: ignore
